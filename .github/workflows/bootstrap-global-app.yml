name: Materialize SurgiBoard Global production app

on:
  push:
    branches:
      - agent/global-production-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/global-production-app
          fetch-depth: 0

      - name: Reassemble and verify reviewed release
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-00 .release/part-01 .release/part-02 .release/part-03 .release/part-04 .release/part-05 .release/part-06 .release/part-07 > /tmp/surgiboard-global-v2.b64
          echo "35465623a4b9ae5c29511115f52dee319a310941c9d95bbf06e78b3fd94e2bb5  /tmp/surgiboard-global-v2.b64" | sha256sum --check --strict
          base64 --decode /tmp/surgiboard-global-v2.b64 > /tmp/surgiboard-global-v2.tar.xz
          echo "a422c0d42379f7eb80d3437307a00ba8763e7c1089bb0445ec2e27928b83a85d  /tmp/surgiboard-global-v2.tar.xz" | sha256sum --check --strict
          git rm -f .release/part-00 .release/part-01 .release/part-02 .release/part-03 .release/part-04 .release/part-05 .release/part-06 .release/part-07 .github/workflows/bootstrap-global-app.yml
          tar -xJf /tmp/surgiboard-global-v2.tar.xz -C .

      - name: Validate production PWA
        shell: bash
        run: |
          set -euo pipefail
          for file in public/assets/*.js public/sw.js; do node --check "$file"; done
          python3 -m json.tool public/manifest.webmanifest >/dev/null
          python3 -m json.tool public/version.json >/dev/null
          test -s public/index.html
          test -s public/assets/styles.css
          test -s public/assets/demo-questions.js
          test -s docs/ARCHITECTURE.md
          grep -q "SurgiBoard Global" public/index.html
          grep -q "DEMO / UNPUBLISHED / NOT FOR CLINICAL USE" public/assets/demo-questions.js
          grep -q "question-pack" public/assets/app-account.js
          grep -q "admin-metrics" public/assets/app-account.js
          ! grep -R -E "SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|PACK_SIGNING_SECRET[[:space:]]*=|postgres(ql)?://[^[:space:]]+" public

      - name: Commit materialized application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build SurgiBoard Global production PWA"
          git push origin HEAD:agent/global-production-app
