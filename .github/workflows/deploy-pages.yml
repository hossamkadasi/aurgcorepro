name: Deploy SurgiBoard Global

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          test -f public/index.html
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/icon.svg
          python -m json.tool public/manifest.webmanifest >/dev/null
          node --check public/sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('public/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline application script found')
          Path('/tmp/surgiboard-app.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/surgiboard-app.js

  bootstrap-pages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages for Actions deployments
        uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('<script defer src="https://cdn.jsdelivr.net', '<script src="https://cdn.jsdelivr.net')
          path.write_text(html, encoding='utf-8')
          PY
          cp public/index.html public/404.html
          touch public/.nojekyll
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
