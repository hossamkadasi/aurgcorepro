name: Validate and deploy SurgiBoard Global

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check public/assets/config.js
          node --check public/assets/demo-questions.js
          node --check public/assets/app-core.js
          node --check public/assets/app-views.js
          node --check public/assets/app-session.js
          node --check public/assets/app-account.js
          node --check public/assets/app-data.js
          node --check public/sw.js
      - name: Validate JSON and required files
        run: |
          python3 -m json.tool public/manifest.webmanifest >/dev/null
          python3 -m json.tool public/version.json >/dev/null
          test -s public/index.html
          test -s public/icon.svg
          test -s docs/ARCHITECTURE.md
          grep -q "SurgiBoard Global" public/index.html
          grep -q "question-pack" public/assets/app-account.js
          grep -q "DEMO / UNPUBLISHED" public/assets/demo-questions.js
      - name: Scan for forbidden server secrets
        run: |
          ! grep -R -E "service_role|SUPABASE_SERVICE_ROLE_KEY|postgresql://|PACK_SIGNING_SECRET" public
      - name: Upload validated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
