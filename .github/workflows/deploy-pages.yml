name: Validate and deploy SurgiBoard Global

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: surgiboard-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production PWA
        shell: bash
        run: |
          set -euo pipefail
          required=(
            public/index.html
            public/manifest.webmanifest
            public/sw.js
            public/version.json
            public/icon.svg
            public/assets/config.js
            public/assets/demo-questions.js
            public/assets/styles.css
            public/assets/app-core.js
            public/assets/app-data.js
            public/assets/app-session.js
            public/assets/app-views.js
            public/assets/app-account.js
          )
          for file in "${required[@]}"; do test -s "$file"; done
          for file in public/assets/*.js public/sw.js; do node --check "$file"; done
          python3 -m json.tool public/manifest.webmanifest >/dev/null
          python3 -m json.tool public/version.json >/dev/null
          grep -q "SurgiBoard Global" public/index.html
          grep -q "Demonstration item — unpublished, not specialist-approved, and not for clinical decision-making." public/assets/demo-questions.js
          grep -q 'questionPack: "question-pack"' public/assets/config.js
          grep -q 'adminMetrics: "admin-metrics"' public/assets/config.js
          ! grep -R -E "SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|PACK_SIGNING_SECRET[[:space:]]*=|postgres(ql)?://[^[:space:]]+" public

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          cp public/index.html public/404.html
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
