<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a3141">
  <meta name="description" content="SurgiBoard Global — evidence-governed General Surgery board preparation with adaptive learning and secure offline study.">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'; upgrade-insecure-requests">
  <title>SurgiBoard Global</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script defer src="./assets/config.js"></script>
  <script defer src="./assets/demo-questions.js"></script>
  <script defer src="./assets/app-core.js"></script>
  <script defer src="./assets/app-views.js"></script>
  <script defer src="./assets/app-session.js"></script>
  <script defer src="./assets/app-account.js"></script>
  <script defer src="./assets/app-data.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to content</a>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar">
      <button class="brand" type="button" data-route="home" aria-label="SurgiBoard Global home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-copy"><strong>SurgiBoard Global</strong><small data-i18n="brandSubtitle">General Surgery Board Intelligence</small></span>
      </button>
      <div class="topbar-actions">
        <span id="networkBadge" class="status-badge status-online" role="status">Online</span>
        <button id="syncButton" class="icon-button" type="button" title="Sync" aria-label="Sync data"><span aria-hidden="true">↻</span></button>
        <button id="languageButton" class="text-button" type="button" aria-label="Change language">AR</button>
        <button id="accountButton" class="account-button" type="button"><span class="avatar" aria-hidden="true">H</span><span id="accountLabel">Sign in</span></button>
      </div>
    </header>

    <div class="app-grid">
      <aside class="sidebar" aria-label="Primary navigation">
        <nav id="mainNav" class="nav-list"></nav>
        <div id="sidebarStatus" class="sidebar-status"></div>
      </aside>

      <main id="workspace" class="workspace" tabindex="-1">
        <div id="viewRoot" class="view-root">
          <div class="loading-state"><span class="loader" aria-hidden="true"></span><p>Preparing SurgiBoard Global…</p></div>
        </div>
      </main>
    </div>

    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>

  <dialog id="authDialog" class="modal-dialog">
    <form id="authForm" class="modal-card" method="dialog" novalidate>
      <button class="modal-close" type="button" data-close-dialog aria-label="Close">×</button>
      <div class="modal-heading">
        <span class="eyebrow">SECURE ACCOUNT</span>
        <h2 id="authTitle">Sign in</h2>
        <p id="authDescription">Sync progress, protected question packs and review history across devices.</p>
      </div>
      <div id="authTabs" class="segmented-control" role="tablist">
        <button type="button" class="active" data-auth-mode="signin" role="tab">Sign in</button>
        <button type="button" data-auth-mode="signup" role="tab">Create account</button>
        <button type="button" data-auth-mode="reset" role="tab">Reset</button>
      </div>
      <label class="field"><span>Email</span><input id="authEmail" type="email" autocomplete="email" required></label>
      <label id="authPasswordField" class="field"><span>Password</span><input id="authPassword" type="password" autocomplete="current-password" minlength="8"></label>
      <label id="authNameField" class="field hidden"><span>Display name</span><input id="authName" type="text" autocomplete="name" maxlength="80"></label>
      <p id="authMessage" class="form-message" role="alert"></p>
      <button id="authSubmit" class="button button-primary button-full" type="submit">Continue</button>
      <p class="fine-print">Authorization is enforced by Supabase Auth, Row Level Security and server-verified roles. No administrative secret is stored in this browser.</p>
    </form>
  </dialog>

  <dialog id="actionDialog" class="modal-dialog">
    <div id="actionDialogContent" class="modal-card"></div>
  </dialog>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="watermark" class="screen-watermark" aria-hidden="true"></div>
  <noscript><div class="noscript">SurgiBoard Global requires JavaScript for secure sessions, offline packs and progress analytics.</div></noscript>
</body>
</html>
